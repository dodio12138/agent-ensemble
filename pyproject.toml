[project]
name = "agent-ensemble"
version = "0.1.0"
description = "Local multi-agent trio with an authoritative MIDI timeline"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aalink>=0.2.3,<0.3",
    "fastapi>=0.116,<1",
    "httpx2>=2,<3",
    "mido>=1.3,<2",
    "pydantic>=2.11,<3",
    "python-rtmidi>=1.5.8,<2",
    "uvicorn>=0.35,<1",
    "websockets>=15,<17",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
